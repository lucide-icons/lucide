version: 2

updates:
  # Root only: one pnpm lockfile covers the whole workspace, so Dependabot
  # discovers every member via pnpm-workspace.yaml from here. Adding workspace
  # members as directories yields manifest-only PRs with a stale lockfile.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # One group per framework, each holding that framework's own build and test
    # tooling, followed by the groups for tooling shared across packages (vite,
    # rollup, typescript are pinned to the same spec in 10+ manifests, so they
    # must move together). A dependency lands in the FIRST group it matches, so
    # framework groups come first and the trailing catch-all keeps unmatched
    # deps out of one-PR-per-dependency.
    groups:
      angular-deps:
        patterns:
          - '@angular/*'
          - '@angular-eslint/*'
          - '@vitest/browser-playwright'
          - 'angular-eslint'
          - 'ng-packagr'
          - 'rxjs'
          - 'tslib'
      react-deps:
        patterns:
          - '@testing-library/react'
          - '@types/prop-types'
          - '@types/react'
          - '@vitejs/plugin-react'
          - 'react'
          - 'react-dom'
      react-native-deps:
        patterns:
          - 'react-native'
          - 'react-native-svg'
      preact-deps:
        patterns:
          - '@preact/preset-vite'
          - '@testing-library/preact'
          - 'preact'
      vue-deps:
        patterns:
          - '@testing-library/vue'
          - '@vitejs/plugin-vue'
          - '@vue/test-utils'
          - 'vue'
      svelte-deps:
        patterns:
          - '@sveltejs/*'
          - '@testing-library/svelte'
          - '@tsconfig/svelte'
          - 'svelte'
          - 'svelte-check'
          - 'svelte-preprocess'
      solid-deps:
        patterns:
          - '@babel/*'
          - '@rollup/plugin-babel'
          - '@solidjs/testing-library'
          - 'babel-preset-solid'
          - 'solid-js'
          - 'vite-plugin-solid'
      astro-deps:
        patterns:
          - '@astrojs/*'
          - 'astro'
      testing-deps:
        patterns:
          - '@testing-library/*'
          - '@vitest/*'
          - 'jest-serializer-html'
          - 'jsdom'
          - 'linkedom'
          - 'vitest'
      build-deps:
        patterns:
          - '@rollup/*'
          - '@vitejs/*'
          - 'esbuild'
          - 'rollup'
          - 'rollup-plugin-*'
          - 'typescript'
          - 'vite'
          - 'vite-plugin-*'
      linting-deps:
        patterns:
          - '@html-eslint/*'
          - '@typescript-eslint/*'
          - 'cspell'
          - 'eslint'
          - 'eslint-*'
          - 'husky'
          - 'lint-staged'
          - 'prettier'
          - 'prettier-plugin-*'
      types-deps:
        patterns:
          - '@types/*'
      remaining-deps:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - '*'
