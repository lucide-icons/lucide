name: Suggest icon metadata
description: Asks an OpenAI model for tags, categories and use-cases for changed icons in a pull request and posts them as review suggestions.

inputs:
  openai-api-key:
    description: OpenAI API key used to generate the suggestions.
    required: true
  github-token:
    description: 'GitHub token with `pull-requests: write` permission to post the review.'
    required: true
  pull-request-number:
    description: Number of the pull request to review.
    required: true
  commit-sha:
    description: Head commit SHA of the pull request the review comments are anchored to.
    required: true
  model:
    description: OpenAI model used to generate the suggestions.
    required: false
    default: gpt-6-luna

runs:
  using: composite
  steps:
    # Suggestions are cached per icon name, so the API is only called again
    # when an icon is added or renamed in the pull request.
    - name: Restore cached suggestions
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/suggest-metadata/suggestions.json
        key: suggest-metadata-v1-pr-${{ inputs.pull-request-number }}
        restore-keys: suggest-metadata-v1-pr-${{ inputs.pull-request-number }}-

    - name: Generate metadata suggestions
      id: generate
      shell: bash
      run: node "$GITHUB_ACTION_PATH/suggestMetaData.mts"
      env:
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PULL_REQUEST_NUMBER: ${{ inputs.pull-request-number }}
        COMMIT_SHA: ${{ inputs.commit-sha }}
        OPENAI_API_MODEL: ${{ inputs.model }}
        SUGGESTIONS_CACHE_FILE: ${{ runner.temp }}/suggest-metadata/suggestions.json

    - name: Save cached suggestions
      if: steps.generate.outputs.cache-updated == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/suggest-metadata/suggestions.json
        key: suggest-metadata-v1-pr-${{ inputs.pull-request-number }}-${{ github.run_id }}-${{ github.run_attempt }}
