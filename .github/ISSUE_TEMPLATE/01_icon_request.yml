name: Icon request
description: Suggest a new icon for this project
labels: ['🙌 icon request']
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, search [existing icons (including Lab)](https://lucide.dev/icons/?library=lab) and open and closed [icon requests](https://github.com/lucide-icons/lucide/issues?q=is%3Aissue+label%3A%22%F0%9F%99%8C+icon+request%22) and [icon PRs](https://github.com/lucide-icons/lucide/pulls?q=is%3Apr+label%3A%22%F0%9F%8E%A8+icon%22). If there is an open request, please add a 👍 instead.

        > [!CAUTION]
        > Please review our [icon eligibility guidelines](https://lucide.dev/contribute/icons/eligibility). Lucide does not accept:
        >
        > - Brand icons or logos.
        > - Hate symbols or discriminatory or dehumanizing imagery.
        > - Religious imagery.
        > - War- or violence-related imagery.
        > - Political imagery.
        > - Sexually explicit or graphic imagery.
        > - Designs copied or traced from sources with unclear provenance or without permission compatible with [Lucide's license](https://lucide.dev/license). Giving credit alone does not grant permission to use a design.
        > - Duplicates without a meaningful distinction, including near-identical concepts and purely decorative variations.

        For more information on brand icons, see our [brand logo statement](https://lucide.dev/brand-logo-statement). Consider [Simple Icons](https://simpleicons.org) for brand logos on a 24×24px grid.
  - type: input
    id: name
    attributes:
      label: Icon name
      description: What should this icon depict? For multiple icons, provide a comma-separated list.
    validations:
      required: true
  - type: textarea
    id: use-cases
    attributes:
      label: Use cases
      description: Why do you need this icon? Include at least two real-life use cases per requested icon, avoiding generic descriptions like "it's a car icon". See our [use case guide](https://lucide.dev/contribute/icons/metadata-conventions/use-case-guide).
      placeholder: e.g. I need a star icon to use in my rating system.
    validations:
      required: true
  - type: textarea
    id: design-ideas
    attributes:
      label: Design ideas
      description: What should this icon look like? Provide simple, minimalistic icon examples from other sets or your own drafts to help us visualize your request.
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: Please review the following checklist before submitting your request.
      options:
        - label: I have searched open and closed [issues](https://github.com/lucide-icons/lucide/issues?q=is%3Aissue) and [PRs](https://github.com/lucide-icons/lucide/pulls?q=is%3Apr) and found no existing request for this icon.
          required: true
        - label: I have searched [existing icons (including Lab)](https://lucide.dev/icons/?library=lab) and confirmed that this icon does not already exist.
          required: true
        - label: I'm not requesting brand icons, logos, or copyrighted, trademarked or otherwise licensed designs.
          required: true
        - label: I'm not requesting hateful or discriminatory symbols, religious or political imagery, violence, or sexually explicit or graphic content.
          required: true
        - label: I have provided appropriate use cases for the icon(s) requested.
          required: true
