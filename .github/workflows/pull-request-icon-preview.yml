name: Pull request icon preview

on:
  pull_request:
    paths:
      - 'icons/*.svg'

permissions: {}

jobs:
  generate-changed-icons-comment:
    name: Generate Changed Icons Comment
    if: github.repository == 'lucide-icons/lucide'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: 'pnpm'
          node-version-file: 'package.json'

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: icons/*.svg

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @lucide/icon-preview-action...

      - name: Save PR number
        run: |
          mkdir -p ./pr
          echo ${{ github.event.number }} > ./pr/NR

      - name: Generate comment markup
        uses: ./.github/actions/icon-preview
        with:
          changed-files: ${{ steps.changed-files.outputs.all_changed_files }}
          output-file: ./pr/comment-markup.md

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr_number
          path: pr/
