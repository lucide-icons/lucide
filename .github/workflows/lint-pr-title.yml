name: Linting PR title

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened

permissions:
  # The semantic PR action only reads the pull request title.
  pull-requests: read

jobs:
  lint-pr-title:
    name: PR Title Lint
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@0723387faaf9b38adef4775cd42cfd5155ed6017 # v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            fix
            feat
            perf
            refactor
            test
            style
            docs
            ci
            build
            chore
          requireScope: true
          ignoreLabels: |
            bot
