name: 'Pull Request Labeler'
on:
  - pull_request_target

permissions: {}

jobs:
  triage:
    if: github.repository == 'lucide-icons/lucide'
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/labeler@v7
